<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت‌نام ایونت ژورنال کلاب: قسمت مقاله‌شناسی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0d0f;
  --navy:#263b57;
  --slate:#4a5467;
  --sand:#c9b488;
  --sun:#fde76a;
  --txt:#f3f1ea;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{
  font-family:Vazirmatn,Tahoma,sans-serif;color:var(--txt);line-height:1.8;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:28px 16px;
  background:
    radial-gradient(ellipse 70% 50% at 85% 100%,rgba(253,231,106,.38),transparent 65%),
    radial-gradient(ellipse 60% 45% at 10% 95%,rgba(201,180,136,.30),transparent 65%),
    radial-gradient(ellipse 80% 60% at 20% 0%,rgba(38,59,87,.95),transparent 70%),
    radial-gradient(ellipse 60% 50% at 95% 20%,rgba(74,84,103,.75),transparent 70%),
    linear-gradient(170deg,#0a0d0f 0%,#16243a 55%,#0a0d0f 100%);
  background-attachment:fixed;
}
.orb{position:fixed;border-radius:50%;filter:blur(60px);z-index:-1;pointer-events:none}
.o1{width:300px;height:300px;background:var(--sun);opacity:.35;top:8%;left:-80px}
.o2{width:340px;height:340px;background:var(--navy);opacity:.9;bottom:-90px;right:-60px}
.o3{width:220px;height:220px;background:var(--sand);opacity:.30;top:55%;left:18%}
.o4{width:260px;height:260px;background:var(--slate);opacity:.7;top:-60px;right:12%}

.card{
  width:100%;max-width:460px;padding:32px 26px 28px;border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3);
}
.badge{display:inline-block;padding:3px 14px;border-radius:99px;font-size:.82rem;color:var(--sun);
  background:rgba(253,231,106,.12);border:1px solid rgba(253,231,106,.45)}
header{text-align:center;margin-bottom:24px}
h1{margin-top:12px;font-size:clamp(1.45rem,5vw,1.9rem);font-weight:800;line-height:1.5;
  background:linear-gradient(90deg,var(--sun),var(--sand));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:2px;font-size:1.05rem;font-weight:600;color:var(--sand)}
header p{margin-top:8px;font-size:.92rem;color:rgba(243,241,234,.78)}

.field{margin-bottom:16px}
label{display:block;margin-bottom:6px;font-size:.92rem;color:var(--sand)}
input{
  width:100%;padding:13px 15px;border-radius:14px;font:inherit;font-size:16px;color:var(--txt);outline:none;
  background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.2);transition:border-color .2s,box-shadow .2s,background .2s;
}
input::placeholder{color:rgba(243,241,234,.4)}
input:focus{border-color:var(--sun);box-shadow:0 0 0 3px rgba(253,231,106,.22);background:rgba(255,255,255,.12)}
input.bad{border-color:#ff9a8a}
.ltr{direction:ltr;text-align:right}
.err{color:#ffb4a6;font-size:.82rem;margin-top:4px;min-height:1.2em}

button.submit{
  width:100%;margin-top:6px;padding:14px;border:0;border-radius:15px;font:inherit;font-weight:800;font-size:1.05rem;
  cursor:pointer;color:var(--black);background:linear-gradient(100deg,var(--sun),var(--sand));
  box-shadow:0 10px 28px rgba(253,231,106,.28);transition:transform .2s,box-shadow .2s;
}
button.submit:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(253,231,106,.4)}
button.submit:focus-visible,.msg button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.submit:disabled{opacity:.6;cursor:wait;transform:none}
.hp{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;padding:0;border:0}

.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.7);padding:18px}
.modal.show{display:flex}
.msg{max-width:420px;text-align:center;padding:32px 24px;border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.06));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(253,231,106,.55);box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.msg .big{font-size:3.2rem}
.msg h3{font-size:1.3rem;color:var(--sun);margin:4px 0}
.msg p{margin-bottom:8px;font-size:.95rem}
.msg button{margin-top:10px;padding:10px 28px;border-radius:99px;border:1px solid var(--sand);background:rgba(201,180,136,.12);color:var(--sand);font:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>

<main class="card">
  <header>
    <span class="badge">🎓 دانشکده مهندسی معدن</span>
    <h1>ثبت‌نام ایونت ژورنال کلاب</h1>
    <div class="sub">قسمت مقاله‌شناسی 📚</div>
    <p>نام و ایمیلت رو وارد کن تا جات رو رزرو کنیم.</p>
  </header>

  <form id="form" novalidate>
    <div class="field">
      <label for="name">نام و نام خانوادگی</label>
      <input id="name" placeholder="مثلاً سارا احمدی" autocomplete="name" required>
      <div class="err" id="e-name"></div>
    </div>
    <div class="field">
      <label for="em">ایمیل</label>
      <input id="em" class="ltr" type="email" placeholder="name@example.com" autocomplete="email" required>
      <div class="err" id="e-em"></div>
    </div>
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="submit" id="btn" type="submit">ثبت‌نام می‌کنم 🚀</button>
  </form>
</main>

<div class="modal" id="modal"><div class="msg">
  <div class="big">🎉</div>
  <h3 id="mTitle">ثبت‌نامت انجام شد!</h3>
  <p>یه ایمیل تأیید برات فرستادیم 📧 (اگه ندیدیش، پوشه‌ی اسپم رو هم چک کن).</p>
  <p>خیلی خوشحالیم که قراره توی ایونت ژورنال کلاب (مقاله‌شناسی) ببینیمت ✨💛</p>
  <button id="close" type="button">باشه، عالیه!</button>
</div></div>

<script>
// ====== تنظیمات ======
// ⚠️ بعد از Deploy کردن Apps Script، آدرس Web app رو اینجا بذار
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwx3ZNc785gSo_AsL1Lx-KaLUyjlGzHgyjuYyH7QOScra6FhR1Rsa7Z1r7UFH80Iv8w/exec";
// ======================
const $ = id => document.getElementById(id);

["name","em"].forEach(id=>$(id).addEventListener("input",()=>{$("e-"+id).textContent="";$(id).classList.remove("bad")}));

function validate(){
  let ok=true;
  const set=(id,m)=>{$("e-"+id).textContent=m;$(id).classList.toggle("bad",!!m);if(m)ok=false};
  const name=$("name").value.trim();
  set("name",name.length>=3&&/\s/.test(name)?"":"نام و نام خانوادگی‌ت رو کامل وارد کن 🙂");
  set("em",/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($("em").value.trim())?"":"یه ایمیل معتبر وارد کن 📧");
  return ok;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if ($("hp").value || !validate()) return;

  const fullName = $("name").value.trim().replace(/\s+/g," ");
  const data = { fullName, email: $("em").value.trim() };

  const btn = $("btn");
  btn.disabled = true;
  btn.textContent = "در حال ثبت… ⏳";

  try {
    // Content-Type باید text/plain باشه تا preflight فرستاده نشه
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data),
      redirect: "follow"
    });

    let result = null;
    try { result = await res.json(); } catch (parseErr) { console.warn("Response is not JSON:", parseErr); }

    if (result && result.success === false) {
      if (result.code === "DUPLICATE_EMAIL") {
        $("e-em").textContent = "این ایمیل قبلاً ثبت‌نام کرده 📧 هر ایمیل فقط یک بار می‌تونه ثبت‌نام کنه.";
        $("em").classList.add("bad");
        $("em").focus();
      } else {
        alert(result.message || "مشکلی پیش اومد 😕 لطفاً دوباره تلاش کن.");
      }
      return;
    }

    $("mTitle").textContent = `${fullName.split(" ")[0]} عزیز، ثبت‌نامت انجام شد!`;
    $("modal").classList.add("show");
    $("form").reset();
  } catch (err) {
    console.error("Submit error:", err);
    alert("مشکلی پیش اومد 😕 لطفاً اتصال اینترنتت رو چک کن و دوباره تلاش کن.");
  } finally {
    btn.disabled = false;
    btn.textContent = "ثبت‌نام می‌کنم 🚀";
  }
});

$("close").onclick=()=>$("modal").classList.remove("show");
</script>
</body>
</html>
